name: CI/CD

on:
  pull_request:
    branches: ["dev", "main"]

env:
  SKIP_ENV_VALIDATION: "1"

jobs:
  quality-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: postgres://app:app@localhost:5432/app
      TEST_DB_URL: postgres://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # Every migration runs against a fresh Postgres, so a migration that
      # fails on an empty database fails here first.
      - name: Migrate test database
        run: npm run db:migrate

      # oxlint + oxfmt --check + Effect diagnostics + vitest, including the
      # transaction rollback test against the service above.
      - name: Run quality checks
        run: npm run staged

  build:
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      # Restore must run before the build to be useful; the save happens at
      # job end automatically.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        run: npm run build
